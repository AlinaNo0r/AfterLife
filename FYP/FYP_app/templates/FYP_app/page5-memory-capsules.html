<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Capsules — The Archivist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#63568F;--primary-container:#B8A9E8;--primary-grad:linear-gradient(135deg,#63568F,#B8A9E8);--surface:#0E0E12;--surface-low:#161620;--surface-lowest:#1E1E2A;--surface-high:#252535;--surface-highest:#2E2E40;--on-surface:#E8E6F0;--on-surface-muted:#9997AA;--tertiary:#E5A09B;--accent-green:#6DBF8A;--glass-bg:rgba(99,86,143,0.15);--glass-border:rgba(184,169,232,0.15);--shadow:0 20px 40px rgba(0,0,0,0.35);--shadow-sm:0 8px 24px rgba(0,0,0,0.25);--spring:cubic-bezier(0.34,1.56,0.64,1);--font-display:'Lexend',sans-serif;--font-body:'Plus Jakarta Sans',sans-serif;--radius-pill:999px;--radius-card:20px;--radius-lg:16px;--sidebar-w:220px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--surface);color:var(--on-surface);display:flex}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;background:var(--surface-low);display:flex;flex-direction:column;padding:28px 0;position:relative;z-index:10}
.sidebar-logo{padding:0 24px 32px;cursor:pointer}
.sidebar-logo h1{font-family:var(--font-display);font-size:1.1rem;font-weight:700;letter-spacing:0.08em;color:var(--on-surface);line-height:1.1}
.sidebar-logo p{font-size:0.7rem;font-weight:500;color:var(--primary-container);letter-spacing:0.12em;margin-top:3px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;margin:2px 12px;border-radius:var(--radius-pill);cursor:pointer;font-size:0.875rem;font-weight:500;color:var(--on-surface-muted);transition:all 0.3s var(--spring);position:relative;user-select:none}
.nav-item:hover{color:var(--on-surface);background:var(--glass-bg)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(99,86,143,0.4)}
.nav-icon{width:20px;height:20px;flex-shrink:0;opacity:0.8}
.nav-item.active .nav-icon{opacity:1}
.sidebar-bottom{margin-top:auto;padding:0 16px}
.stay-alive-btn{width:100%;padding:14px;background:var(--primary-grad);border:none;border-radius:var(--radius-pill);font-family:var(--font-body);font-size:0.8rem;font-weight:700;letter-spacing:0.12em;color:#fff;cursor:pointer;transition:all 0.4s var(--spring);box-shadow:0 4px 20px rgba(99,86,143,0.5);margin-bottom:16px}
.stay-alive-btn:hover{transform:scale(1.04)}
.user-card{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface-lowest);border-radius:var(--radius-lg);cursor:pointer}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-grad);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:#fff}
.user-info h4{font-size:0.8rem;font-weight:600;color:var(--on-surface)}
.user-info p{font-size:0.65rem;font-weight:500;color:var(--accent-green);letter-spacing:0.1em}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:16px;padding:20px 32px;background:var(--glass-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);flex-shrink:0}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--on-surface-muted)}
.search-input{width:100%;padding:10px 14px 10px 40px;background:var(--surface-lowest);border:none;border-radius:var(--radius-pill);font-family:var(--font-body);font-size:0.875rem;color:var(--on-surface);outline:none}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface-lowest);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.35s var(--spring);color:var(--on-surface-muted)}
.icon-btn:hover{background:var(--surface-high);transform:scale(1.1)}
.icon-btn svg{width:18px;height:18px}
.avatar-btn{width:40px;height:40px;border-radius:50%;background:var(--primary-grad);border:2px solid var(--primary-container);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:#fff}
.content{flex:1;overflow-y:auto;padding:36px 32px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--surface-highest);border-radius:4px}
.page-header{margin-bottom:28px}
.page-header h2{font-family:var(--font-display);font-size:2rem;font-weight:600;letter-spacing:-0.02em}
.page-header p{color:var(--on-surface-muted);margin-top:6px;font-size:0.9rem}
.capsules-filter{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filter-chip{padding:8px 18px;border-radius:var(--radius-pill);border:none;font-family:var(--font-body);font-size:0.8rem;font-weight:500;cursor:pointer;transition:all 0.35s var(--spring)}
.filter-chip.active{background:var(--primary);color:#fff}
.filter-chip:not(.active){background:var(--surface-lowest);color:var(--on-surface-muted)}
.filter-chip:hover:not(.active){background:var(--surface-high);color:var(--on-surface)}
.capsules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.capsule-card{background:var(--surface-lowest);border-radius:var(--radius-card);overflow:hidden;cursor:pointer;transition:all 0.4s var(--spring);box-shadow:var(--shadow-sm)}
.capsule-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.capsule-thumb{height:120px;background:var(--surface-high);display:flex;align-items:center;justify-content:center;position:relative}
.capsule-thumb svg{width:40px;height:40px;color:var(--on-surface-muted);opacity:0.5}
.capsule-thumb .lock-overlay{position:absolute;top:10px;right:10px;width:28px;height:28px;background:rgba(0,0,0,0.5);border-radius:8px;display:flex;align-items:center;justify-content:center}
.capsule-thumb .lock-overlay svg{width:14px;height:14px;color:var(--accent-green);opacity:1}
.capsule-body{padding:18px}
.capsule-body h4{font-weight:600;font-size:0.95rem;margin-bottom:6px}
.capsule-body p{font-size:0.78rem;color:var(--on-surface-muted);line-height:1.5}
.capsule-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mem-tag{padding:3px 10px;background:rgba(229,160,155,0.2);border-radius:var(--radius-pill);font-size:0.65rem;font-weight:600;color:var(--tertiary)}
.capsule-meta{font-size:0.7rem;color:var(--on-surface-muted);margin-top:8px}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>THE ARCHIVIST</h1>
    <p>Digital Ghost</p>
  </div>
  <nav>
    <div class="nav-item" onclick="window.location.href='page2-dashboard.html'">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </div>
    <div class="nav-item" onclick="window.location.href='page3-trusted-circle.html'">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><path d="M3 20c0-4 2.7-7 6-7 1.2 0 2.3.4 3.2 1.1"/><path d="M13 20c0-2.4 1.8-4.4 4-4.4s4 2 4 4.4"/></svg>
      <span>Trusted Circle</span>
    </div>
    <div class="nav-item" onclick="window.location.href='page4-hidden-keys.html'">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M12 15h9"/><path d="M18 12v6"/></svg>
      <span>Hidden Keys</span>
    </div>
    <div class="nav-item active" onclick="window.location.href='page5-memory-capsules.html'">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
      <span>Memory Capsules</span>
    </div>
    <div class="nav-item" onclick="window.location.href='page6-legacy-ai.html'">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <span>Legacy AI</span>
    </div>
  </nav>
  <div class="sidebar-bottom">
    <button class="stay-alive-btn">STAY ALIVE</button>
    <div class="user-card">
      <div class="user-avatar">DE</div>
      <div class="user-info">
        <h4>Digital Echo</h4>
        <p>STATUS: ACTIVE</p>
      </div>
    </div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" placeholder="Search archive...">
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="toggleTheme()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="avatar-btn">DE</button>
    </div>
  </header>
  <div class="content">
    <div class="page-header">
      <h2>Memory Capsules</h2>
      <p>Sealed artifacts waiting to tell your story. Time-locked and encrypted until release.</p>
    </div>
    <div class="capsules-filter">
      <button class="filter-chip active" onclick="filterCapsules(this,'all')">All</button>
      <button class="filter-chip" onclick="filterCapsules(this,'family')">Family</button>
      <button class="filter-chip" onclick="filterCapsules(this,'voice')">Voice Notes</button>
      <button class="filter-chip" onclick="filterCapsules(this,'secrets')">Secrets</button>
      <button class="filter-chip" onclick="filterCapsules(this,'media')">Media</button>
    </div>
    <div class="capsules-grid" id="capsulesGrid"></div>
  </div>
</main>
<script>
const capsulesData=[
  {title:'Letter to My Children',tags:['Family','Secrets'],category:'family',desc:'A sealed letter to be opened on their 18th birthday.',date:'Release: 2045'},
  {title:'Voice of Youth',tags:['Voice Note','Family'],category:'voice',desc:'Recordings of me reading bedtime stories, ages 28–34.',date:'Release: 2040'},
  {title:'My Life in Photos',tags:['Media','Family'],category:'media',desc:'1,200 curated photographs spanning three decades.',date:'Release: 2050'},
  {title:'Untold Secrets',tags:['Secrets'],category:'secrets',desc:'Three things I never told anyone, sealed until 2060.',date:'Release: 2060'},
  {title:'Career Lessons',tags:['Voice Note'],category:'voice',desc:'Everything I wish I knew starting out. For the next generation.',date:'Release: 2035'},
  {title:'The Love Letters',tags:['Family','Secrets'],category:'family',desc:'Every letter I ever wrote but never sent.',date:'Release: 2045'}
];
function renderCapsules(filter='all'){
  const g=document.getElementById('capsulesGrid');
  const filtered=filter==='all'?capsulesData:capsulesData.filter(c=>c.category===filter);
  g.innerHTML=filtered.map(c=>`
    <div class="capsule-card">
      <div class="capsule-thumb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14,2 14,8 20,8"/></svg>
        <div class="lock-overlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
      </div>
      <div class="capsule-body">
        <h4>${c.title}</h4>
        <p>${c.desc}</p>
        <div class="capsule-tags">${c.tags.map(t=>`<span class="mem-tag">${t}</span>`).join('')}</div>
        <div class="capsule-meta">${c.date}</div>
      </div>
    </div>
  `).join('');
}
function filterCapsules(el,filter){
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderCapsules(filter);
}
function toggleTheme(){
  const html=document.documentElement;
  const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
}
renderCapsules();
</script>
</body>
</html>
